name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "ci-placeholder-secret-min-32-chars-long"
      AI_PROVIDER: "mock"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned: package-lock.json was generated with the npm bundled
          # in this Node release. Floating `24` pulls a newer npm whose
          # optional-dependency resolution no longer matches the lock.
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run verify:export
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
